name: makki_fila
description: Lector de tickets del casino Makki para el mesón.
publish_to: "none"
# Solo es el valor de respaldo para compilar a mano: el CI estampa la versión real de cada
# publicación con --build-name/--build-number. Si esto fuera la versión de verdad, todos los
# APK dirían lo mismo y ningún actualizador automático los distinguiría.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Lector de QR con la cámara. El rango es amplio a propósito: la versión exacta la resuelve
  # el CI contra la versión de Flutter del build.
  mobile_scanner: ">=5.0.0 <8.0.0"
  http: ^1.2.0
  shared_preferences: ^2.3.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
