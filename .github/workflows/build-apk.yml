name: Compilar APK

# La VM de desarrollo no compila Android: el APK se arma acá y se publica como Release,
# para que Obtainium lo instale y lo actualice solo en los equipos del mesón.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write # para crear el Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Versión fija, no "la estable del día": el build tiene que ser reproducible.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # El repo versiona solo lib/ y pubspec: las carpetas de plataforma se generan acá.
      - name: Generar carpeta android
        run: |
          flutter create --org cl.makki --project-name makki_fila --platforms=android .
          rm -f test/widget_test.dart

      # Firma con la clave de Makki, siempre la misma. Sin esto Flutter usa una clave de
      # depuración que el runner inventa en cada compilación: Android compara firmas al
      # actualizar, no la reconoce, y responde failureConflict.
      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/makki.jks
          printf 'storeFile=makki.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          python3 tools/firmar_android.py

      - name: Dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      # Las pruebas son de lo que no se puede probar a mano sin cortarle el wifi a la tablet:
      # que la fila siga sirviendo sin señal y que la cola no se pierda.
      - name: Pruebas
        run: flutter test

      # La cámara es el corazón de la app: sin este permiso el lector no abre.
      - name: Permisos y nombre
        run: |
          sed -i -E 's/android:label="[^"]+"/android:label="Makki Fila"/' android/app/src/main/AndroidManifest.xml
          # Android 9+ bloquea el HTTP sin cifrar. Mientras el servidor se alcance por IP no hay
          # certificado posible, así que se permite explícitamente. QUITAR cuando dev.makki.cl
          # tenga HTTPS: con dominio, esto deja de ser necesario y conviene que vuelva a bloquearse.
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || \
            sed -i -E 's/(<application)/\1 android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          # mobile_scanner necesita minSdk 21+; Flutter ya usa uno mayor, pero se deja explícito.
          sed -i -E 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts 2>/dev/null || true

      # La versión se estampa acá, no en pubspec.yaml. Sin esto todos los APK salían con la
      # misma versión interna (1.0.0, código 1) y Obtainium, que compara la versión del
      # archivo con la instalada, concluía que no había nada que actualizar por mucho que la
      # publicación se llamara v1.0.13. El número de ejecución es monótono: sirve de código
      # de versión para Android, que solo acepta subir.
      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=MAKKI_BASE_URL=${{ vars.MAKKI_BASE_URL }}

      # Si la firma no es la de Makki, no se publica: un APK con otra firma no se instala
      # encima del que está en la tablet y deja a los equipos sin poder actualizar.
      - name: Comprobar la firma
        run: |
          set -e
          # apksigner y no keytool: los APK de hoy se firman con el esquema v2/v3 y ya no
          # llevan la firma dentro del JAR, así que keytool no encuentra nada.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > /tmp/cert.txt
          grep -i "SHA-256 digest" /tmp/cert.txt | head -1
          grep -qi "8390b60292 11b188" /tmp/cert.txt \
            || grep -qi "8390b6029211b188" /tmp/cert.txt \
            || { echo "!! El APK no quedó firmado con la clave de Makki"; cat /tmp/cert.txt; exit 1; }

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Makki Fila v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
